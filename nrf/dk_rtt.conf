# DK diagnostic overlay: route the console to SEGGER RTT so boot + advertising
# logs are readable over the onboard J-Link (JLinkRTTLogger / JLinkRTTClient),
# independent of USB/UART. Layer on top of prj_controller_btusb.conf.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
# Large up-buffer so the one-shot boot/advertising logs survive in the RTT
# buffer until the host logger attaches after a flash+reset.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
