# XIAO SWD/J-Link dev build (no Adafruit UF2 bootloader).
#
# The shipping XIAO boots via the Adafruit UF2 bootloader, which reserves the
# low flash and runs the app from the 0x27000 slot (CONFIG_FLASH_LOAD_OFFSET via
# the devicetree code-partition). Flashing over SWD with `nrfjprog --chiperase`
# ERASES that bootloader, so an app linked at 0x27000 has nothing valid at 0x0
# and HardFaults on reset.
#
# For SWD flashing, link the app at flash origin 0x0 (self-contained, no
# bootloader) — the same shape as the nRF52840 DK build. Layer this conf on top
# of xiao_ble.conf + prj_controller_btusb.conf, then flash zephyr.hex over SWD.
# (Drop it to build the normal UF2 image again.)
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0
CONFIG_BUILD_OUTPUT_UF2=n
