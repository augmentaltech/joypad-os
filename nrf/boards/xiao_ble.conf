# Seeed XIAO nRF52840 board-specific config
# DCDC is configured via devicetree in the board definition (xiao_ble_common.dtsi)

# TinyUSB owns the USB peripheral (the usbd node is disabled in the overlay).
# The XIAO board defaults to a USB-CDC ACM console (BOARD_SERIAL_BACKEND_CDC_ACM),
# which pulls in the device-next USB stack + cdc_acm_serial.c and binds the
# now-disabled UDC (zephyr_udc0). Turn that backend off; console/logs go over
# uart0 / RTT instead.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
