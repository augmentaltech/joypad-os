# nRF52840 DK (PCA10056) — MouthPad message-output -> Switch bring-up board.
#
# Flashed over the onboard J-Link (raw zephyr.hex; no UF2/MCUboot). TinyUSB owns
# the USB peripheral for the Switch HID output. The console stays on the board
# default (uart0, exposed as the J-Link VCOM) for the first bring-up; SEGGER RTT
# logging is layered on once the image boots.
CONFIG_BT_SETTINGS=y
